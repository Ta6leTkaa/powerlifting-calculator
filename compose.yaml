services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: powerlifting
      POSTGRES_USER: powerlifting
      POSTGRES_PASSWORD: powerlifting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerlifting"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://powerlifting:powerlifting@db:5432/powerlifting
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://powerlifting:powerlifting@db:5432/powerlifting
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
